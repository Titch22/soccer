# Drop into /etc/nginx/sites-available/rematch and symlink to sites-enabled.
# Get certificates with: certbot --nginx -d game.example.com
server {
    listen 80;
    server_name game.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name game.example.com;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    # Built client (packages/client/dist)
    root /var/www/rematch;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Colyseus WebSocket + matchmaking HTTP. The trailing slash on proxy_pass
    # strips the /ws/ prefix before forwarding.
    location /ws/ {
        proxy_pass http://127.0.0.1:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
