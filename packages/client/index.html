<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rematch Web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        white-space: nowrap;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 18px;
        border-radius: 8px;
      }
      #status-banner {
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(200, 60, 30, 0.85);
        padding: 6px 16px;
        border-radius: 6px;
        font-size: 15px;
        pointer-events: none;
      }
      #status-banner[hidden] {
        display: none;
      }
      #goal-toast {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        color: #fff;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-shadow: 0 2px 8px #000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      #goal-toast.visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #landing {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(circle at center, #1e7a34 0%, #0a2e14 100%);
        color: #fff;
        z-index: 10;
      }
      #landing[hidden] {
        display: none;
      }
      #landing h1 {
        font-size: 42px;
        margin: 0;
        letter-spacing: 0.05em;
      }
      #landing p {
        margin: 0;
        opacity: 0.8;
        max-width: 420px;
        text-align: center;
      }
      #join-button {
        font-size: 20px;
        font-weight: 600;
        padding: 12px 32px;
        border-radius: 999px;
        border: none;
        background: #fff;
        color: #0a2e14;
        cursor: pointer;
      }
      #join-button:hover {
        background: #dfffe6;
      }
      #join-button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden></div>
    <div id="status-banner" hidden></div>
    <div id="goal-toast"></div>
    <div id="landing">
      <h1>Rematch Web</h1>
      <p>2D controller-friendly soccer. WASD/left stick to move, mouse/right stick to aim, click/RT to shoot, Space/X to pass, Ctrl/B to tackle, Q/A to tap the ball forward.</p>
      <button id="join-button">Join Match</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
